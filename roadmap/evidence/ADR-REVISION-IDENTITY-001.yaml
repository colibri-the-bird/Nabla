acceptance_evidence:
  - requirement: The four ADRs form one compatible identity, revision, conflict and migration model.
    proof: >-
      ADR-009 defines typed offline UUID identities, distinct store/writer
      incarnation state, per-device commit sequence, explicit ancestry/dependency
      causality, versioned operational event envelopes, and non-authoritative
      clocks. ADR-002 binds those identities to fingerprinted immutable CE
      revision envelopes, bounded hybrid bodies, a single-root graph, an exact
      unordered frontier, opaque maxima, and immutable migration/resolution
      provenance; persisted frontier indexes and redundant materializations are
      rebuildable DD. ADR-004 uses exact graph/frontier inputs for conservative
      Markdown merge, bounded rebuildable DD conflict descriptors, final
      resolution, and ancestry-preserving reductions for frontiers above eight.
      ADR-012 preserves identities and graph meaning during physical migration,
      models migration as a privileged hash-chained OT workflow with separate CA,
      and emits one branch-preserving child per bounded complete frontier: a full
      snapshot for live/archived content or DeletedBody for deleted content.
  - requirement: Replay measurements are cited and unmeasured assumptions are explicit.
    proof: >-
      Each ADR cites approved REVISION-SYNC-PREPARATION-SPIKE-v1, semantic digest
      f60a38c640d5b8c7bdd9b3f6bdbf727f3ebf9932746c04494421790495223771,
      and raw-result SHA-256
      b9ea6908f265440f36add96ac2f8123ea37e50610e3e6360dd81a75e1e0a3b9c.
      The records distinguish 7 passed cases and 124 assertions, the bounded
      512-ID/two-device fixture with zero measured collisions, two preserved
      heads, stale/partial rejection with exactly four absent effects (command
      receipt, revision, frontier change, and outbox row), selected transaction
      crash points, typed missing parents, and all 24 convergent schedules with
      at most 3 passes under 6. Audit/log effects, production IDs, hybrid storage,
      Markdown merge, migration, performance, power-loss/corruption durability,
      mobile, network, clone fencing, and UX remain explicitly unmeasured.
  - requirement: ADR-002, ADR-004, ADR-009 and ADR-012 are accepted after owner approval.
    proof: >-
      Pending explicit owner approval. All four ADRs remain Proposed and
      governance/decisions.yaml intentionally keeps all four decisions
      required; acceptance is not inferred from review or draft PR creation.
  - requirement: ADR-DOCUMENT-ENGINE-001 is the only activated successor.
    proof: >-
      Pending explicit owner approval and acceptance of all four ADRs.
      roadmap/tasks/ADR-REVISION-IDENTITY-001.yaml remains ready,
      roadmap/tasks/ADR-DOCUMENT-ENGINE-001.yaml remains blocked, and no
      successor is activated by this draft.

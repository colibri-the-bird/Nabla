acceptance_evidence:
- requirement: Bootstrap pilot no longer depends on protection that itself requires
    the pilot.
  proof: BOOT-PILOT-001 depends on BOOT-REPAIR-001, BOOT-PROTECT-001 depends
    on the pilot, and GITHUB-BRANCH-PROTECTION is provided only by the protection
    task. The combined task/artifact-provider DAG validator passes.
- requirement: Repository tests validate lifecycle invariants instead of freezing
    incomplete states.
  proof: Tests use baseline subsets and recomputed hashes, accept valid lifecycle
    evolution, enforce one ready card, and verify the complete successor chain.
    The targeted suite passes without relying on a frozen test count.
- requirement: Completed tasks prove declared acceptance commands and owner approval
    where required.
  proof: validate_evidence requires exact test/proof requirement coverage, successful
    exit codes, a current manifest, PR URL, no unresolved decisions, and explicit
    owner approval for owner-required completed tasks. The PR gate rebuilds triggered
    context and compares selectors, document hashes, impact tags and triggers.
- requirement: Legacy completed task evidence is migrated explicitly rather than silently
    grandfathered.
  proof: All six completed BOOT evidence files are schema v2 and map each declared
    acceptance test and evidence requirement explicitly.
- requirement: SPEC-NAVIGATION documents the enforced task and evidence v2 lifecycle.
  proof: SPEC-NAVIGATION v0.3 documents the full task shape, artifact providers,
    one-ready lifecycle, exact evidence mapping, owner approval, and PR-ready versus
    merged semantics.
- requirement: The BOOT-REPAIR transition has exactly one successor; while repair
    is active it is the sole ready task, and on completion only BOOT-PILOT-001 may
    become ready.
  proof: list-ready reports only BOOT-REPAIR-001. A generic repository test derives
    the complete bootstrap chain and verifies a single mutable successor path,
    the blocked frontier, and predecessor scope authority without freezing future
    task IDs.
- requirement: Production implementation remains blocked.
  proof: No implementation task card exists. PREP-ROADMAP-PROD-001 may create a
    blocked scaffold card only after foundation conformance, and the final owner
    audit is the only task allowed to activate it.

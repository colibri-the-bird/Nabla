acceptance_evidence:
  - requirement: ADR-003 defines bounded grammar, authority, limits and deterministic rejection.
    proof: >-
      ADR-003 sections 1-4 define the closed versioned AST, exact
      Registry/source/operator/feature bindings, type and missing/null rules,
      separate typed parameters, normalization, and bound identity; sections
      5-7 apply the fail-closed authority intersection and finite structural,
      work, output, pagination, snapshot, and runtime ceilings; section 10
      fixes stage-ordered deterministic minimized rejection.
  - requirement: Injection, sensitive-output and compatibility risks have explicit treatment.
    proof: >-
      ADR-003 sections 2, 4-6, and 8-10 plus Compatibility constraints,
      Consequences, Alternatives considered, Validation obligations, Deferred
      decisions, and Supersession rules prohibit syntax/identifier
      interpolation and raw SQL/code, protect hidden existence, relation,
      cardinality, cursor, audit/cache, derived and AI outbound data, pin exact
      versions/hashes/policy, require cross-platform fixtures, and record the
      missing parser/planner/cost/cursor implementation evidence.
  - requirement: ADR-003 is accepted in the registry after owner approval.
    proof: >-
      Explicit Nabla project owner approval in the 2026-08-22 Codex prompt for
      TASK-ID ADR-QUERY-DSL-001 accepted ADR-003; the decision record is
      Accepted and governance/decisions.yaml records ADR-003 as accepted.
  - requirement: ADR-REVISION-IDENTITY-001 is the only activated successor.
    proof: >-
      After ADR-003 acceptance, roadmap/tasks/ADR-QUERY-DSL-001.yaml changed
      ready to completed and roadmap/tasks/ADR-REVISION-IDENTITY-001.yaml
      changed blocked to ready; the final ready-list shows no other activated
      task.

schema_version: 2
task_id: AUDIT-SCAFFOLD-READINESS-001
type: audit
state: blocked
outcome: The owner confirms that the repository, roadmap and first implementation card are safe to begin application scaffolding.
router: BOOT:1
scope:
  include:
    - Audit the production roadmap and APP-SCAFFOLD-001 against the approved foundation.
    - Confirm development tooling, required checks, contracts, DDL and recovery gates are usable.
    - Apply owner-requested roadmap or scaffold-card corrections that remain within the approved foundation.
    - If the audit finds a bounded defect, insert a CORRECTIVE task before this checkpoint and rewire the bootstrap router to it.
    - Record explicit owner approval as the final pre-development checkpoint.
    - Activate APP-SCAFFOLD-001 only when every gate passes.
  exclude:
    - Do not broaden product scope or authority beyond the approved foundation without a new task.
    - Do not create application code, prototypes or production dependency state.
    - Do not waive failed or unresolved gates.
  paths:
    include:
      - audits/SCAFFOLD-READINESS-001.md
      - ROADMAP.md
      - roadmap/BOOTSTRAP.md
      - roadmap/tasks/CORRECTIVE-*.yaml
      - governance/spec-lock.json
      - spec-index.json
      - roadmap/tasks/AUDIT-SCAFFOLD-READINESS-001.yaml
      - roadmap/tasks/APP-SCAFFOLD-001.yaml
      - roadmap/evidence/AUDIT-SCAFFOLD-READINESS-001.yaml
    exclude:
      - CONSTITUTION.md
      - ARCHITECTURE.md
      - DATA-CLASSIFICATION.md
      - CAPABILITY-CONTRACT.md
      - MODULE-MANIFEST.md
      - LOOP-SPEC.md
      - KNOWLEDGE-MODULE.md
      - DOCUMENT-MODULE.md
      - BACKUP-RECOVERY.md
      - DATA-CATALOG.md
      - db/**
      - contracts/**
      - schemas/**
      - src/**
      - app/**
      - core/**
      - modules/**

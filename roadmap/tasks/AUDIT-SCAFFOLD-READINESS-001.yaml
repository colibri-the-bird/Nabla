    - python -m pytest -q
    - python tools/spec_slice.py validate
    - python tools/nabla_nav.py validate
    - python tools/nabla_nav.py check-lock
    - First implementation task scope and dependency review
  invariants:
    - I6
    - I15
  evidence:
    - The roadmap, first implementation task and repository gates agree on scope and dependencies.
    - Required checks, contracts, DDL, migration and recovery evidence are available.
    - No mandatory decision, artifact, reference or unresolved foundation defect remains.
    - The owner explicitly approves application development and APP-SCAFFOLD-001 is activated.
approval:

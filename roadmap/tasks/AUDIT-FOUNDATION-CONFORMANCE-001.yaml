schema_version: 2
task_id: AUDIT-FOUNDATION-CONFORMANCE-001
type: audit
state: blocked
outcome: The complete normative, catalog, contract and DDL foundation passes cross-layer conformance and owner checkpoint review.
router: BOOT:1
scope:
  include:
    - Audit traceability from Constitution through specs, ADRs, catalog, contracts and DDL.
    - Run all foundation validators and representative lifecycle, failure and recovery scenarios.
    - Record every unresolved issue as a blocker or an explicitly non-blocking deferred decision.
    - Apply owner-requested changes to blocked roadmap/scaffold preparation or add a bounded corrective task.
    - Activate PREP-ROADMAP-PROD-001 as the sole successor after owner approval.
  exclude:
    - Do not fix normative or schema defects inside the audit task.
    - Do not create application code or a production roadmap.
  paths:
    include:
      - audits/FOUNDATION-CONFORMANCE-001.md
      - tests/conformance/**
      - governance/spec-lock.json
      - spec-index.json
      - roadmap/BOOTSTRAP.md
      - roadmap/tasks/AUDIT-FOUNDATION-CONFORMANCE-001.yaml
      - roadmap/tasks/CORRECTIVE-*.yaml
      - roadmap/tasks/PREP-ROADMAP-PROD-001.yaml
      - roadmap/tasks/AUDIT-SCAFFOLD-READINESS-001.yaml
      - roadmap/evidence/AUDIT-FOUNDATION-CONFORMANCE-001.yaml
    exclude:
      - CONSTITUTION.md
      - ARCHITECTURE.md
      - DATA-CLASSIFICATION.md
      - CAPABILITY-CONTRACT.md
      - MODULE-MANIFEST.md
      - LOOP-SPEC.md
      - KNOWLEDGE-MODULE.md
      - DOCUMENT-MODULE.md
      - BACKUP-RECOVERY.md
      - DATA-CATALOG.md
      - db/**
      - contracts/**
      - schemas/**
      - src/**
      - app/**
      - core/**
      - modules/**

      - BACKUP-RECOVERY.md
      - governance/artifacts.yaml
      - governance/spec-lock.json
      - spec-index.json
      - tests/test_spec_slice.py
      - roadmap/tasks/SPEC-BACKUP-RECOVERY-001.yaml
      - roadmap/tasks/SPEC-DATA-CATALOG-V1-001.yaml
      - roadmap/evidence/SPEC-BACKUP-RECOVERY-001.yaml
    exclude:
      - CONSTITUTION.md
      - ARCHITECTURE.md
      - DATA-CLASSIFICATION.md
      - CAPABILITY-CONTRACT.md
      - MODULE-MANIFEST.md
      - LOOP-SPEC.md
      - KNOWLEDGE-MODULE.md
      - DOCUMENT-MODULE.md
      - src/**
      - app/**
      - core/**
      - modules/**

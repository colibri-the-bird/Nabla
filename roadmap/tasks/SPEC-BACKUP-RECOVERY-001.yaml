schema_version: 2
task_id: SPEC-BACKUP-RECOVERY-001
type: spec
state: blocked
outcome: BACKUP-RECOVERY.md is an approved normative contract grounded in the baseline, accepted ADRs and measured restore behavior.
router: BOOT:1
scope:
  include:
    - Author BACKUP-RECOVERY.md from approved repository sources and measured backup evidence.
    - Define authority, consistency, encryption, restore, verification, retention, purge and failure behavior.
    - Register and lock the new normative document after owner approval.
    - Activate SPEC-DATA-CATALOG-V1-001 as the sole successor.
  exclude:
    - Do not reconstruct text from chat summaries or missing archive recollections.
    - Do not implement backup, restore, encryption or purge.
    - Do not change unrelated normative specifications.
  paths:
